<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Portal | Unified Health ID</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f9f8;color:#203a40}
header{background:white;padding:20px 7%;border-bottom:1px solid #dce9e7}
header h2{margin:0;color:#147d78}
main{max-width:800px;margin:35px auto;padding:18px}
.back-link{display:inline-block;margin-bottom:15px;color:#147d78;font-weight:bold;font-size:14px;text-decoration:none}
.back-link:hover{text-decoration:underline}
.card{background:white;padding:25px;border-radius:14px;margin-bottom:20px;box-shadow:0 5px 20px #163c3c10}
h1{margin-top:0;font-size:26px}
label{display:block;font-weight:bold;font-size:14px;margin:15px 0 7px}
input{width:100%;padding:12px;border:1px solid #cbdcda;border-radius:8px;font-size:15px}
button{background:#147d78;color:white;border:0;border-radius:8px;padding:12px 17px;margin-top:18px;cursor:pointer;font-weight:bold}
button:hover{background:#0c625e}
.hidden{display:none}
.info{background:#eaf6f3;padding:16px;border-radius:9px;line-height:1.8}
.record{border:1px solid #dce9e7;border-radius:9px;padding:15px;margin-top:12px}
@media(max-width:600px){main{padding:12px}}
</style>
</head>
<body>
<header><h2>Unified Health ID — Patient Portal</h2></header>

<main>
<a class="back-link" href="home.html">← Back to Home</a>

<section class="card" id="verifySection">
<h1>Access Your Health Records</h1>
<p>Enter your patient ID and the phone number used during registration.</p>

<form id="verifyForm">
<label for="patientId">Five-digit Patient ID</label>
<input id="patientId" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required placeholder="Enter patient ID">

<label for="phone">Registered Phone Number</label>
<input id="phone" type="tel" inputmode="numeric" required placeholder="Enter registered phone number">

<button type="submit">View My Records</button>
<p id="message" role="status"></p>
</form>
</section>

<section class="card hidden" id="recordsSection">
<h1>My Health Records</h1>
<div class="info" id="patientDetails"></div>

<h2>Prescriptions</h2>
<div id="prescriptions"></div>

<h2>Lab Reports</h2>
<div id="reports"></div>

<button type="button" id="logoutButton">Log Out</button>
</section>
</main>

<script src="data.js"></script>
<script>
document.getElementById("verifyForm").addEventListener("submit",function(event){
  event.preventDefault();

  const id = document.getElementById("patientId").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const db = loadDB();
  const patient = db.patients[id];

  if(!/^[0-9]{5}$/.test(id)){
    document.getElementById("message").textContent =
      "Patient ID must contain exactly five digits.";
    return;
  }

  if(!patient || String(patient.contact).trim() !== phone){
    document.getElementById("message").textContent =
      "Details do not match a registered patient.";
    return;
  }

  document.getElementById("message").textContent = "";
  document.getElementById("verifySection").classList.add("hidden");
  document.getElementById("recordsSection").classList.remove("hidden");

  document.getElementById("patientDetails").innerHTML =
    "<strong>Name:</strong> " + escapeHTML(patient.fullName) + "<br>" +
    "<strong>Patient ID:</strong> " + escapeHTML(patient.id) + "<br>" +
    "<strong>Age:</strong> " + escapeHTML(patient.age) + "<br>" +
    "<strong>Blood Group:</strong> " + escapeHTML(patient.bloodGroup);

  const prescriptions = patient.prescriptions || [];
  document.getElementById("prescriptions").innerHTML =
    prescriptions.length ? prescriptions.map(function(p, index){
      return prescriptionHTML(p, patient, index);
    }).join("") : "<p>No prescriptions available yet.</p>";

  const reports = patient.reports || [];
  document.getElementById("reports").innerHTML =
    reports.length ? reports.map(function(r){
      return '<div class="record"><strong>' +
      escapeHTML(r.name || "Lab Report") + '</strong><p>' +
      escapeHTML(r.date || "") + '</p><p>' +
      escapeHTML(r.details || "") + '</p></div>';
    }).join("") : "<p>No lab reports available yet.</p>";
});

document.getElementById("logoutButton").addEventListener("click",function(){
  document.getElementById("recordsSection").classList.add("hidden");
  document.getElementById("verifySection").classList.remove("hidden");
  document.getElementById("verifyForm").reset();
});
</script>
</body>
</html>
